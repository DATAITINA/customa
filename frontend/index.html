<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FDE6E2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>Customa</title>
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <!-- Installable app (Home Screen), needed for alerts on iPhone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // iPhone reads the manifest when the page first loads, so a stand page points at its own
      // manifest from the start: the Home Screen app then opens this stand with this customer's card.
      (function () {
        var m = location.pathname.match(/^\/s\/([^/]+)/);
        if (!m) return;
        var href = '/m/' + m[1];
        try { href = localStorage.getItem('customa:manifest:' + m[1]) || href; } catch (e) {}
        document.querySelector('link[rel="manifest"]').href = href;
      })();
    </script>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Customa" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Lilita+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
